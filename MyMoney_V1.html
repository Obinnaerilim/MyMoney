<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>MyMoney · Personal Finance</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eaf2fb;background:#0b1220}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1120px;margin:auto;padding:24px 18px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand span{color:#65e7bd}.muted{color:#91a4bc}.small{font-size:12px}.pill{border:1px solid #31425a;padding:8px 11px;border-radius:30px;font-size:12px;color:#a9bfd6}.nav{display:flex;gap:7px;overflow:auto;margin:24px 0 22px;padding-bottom:4px}.nav button{white-space:nowrap;background:#131f31;color:#9eb2ca;border:1px solid #273750;padding:11px 15px;border-radius:12px}.nav button.active{background:#214b43;border-color:#408a72;color:#85f4cb}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:#131f31;border:1px solid #263750;border-radius:18px;padding:20px;min-width:0}.hero{background:linear-gradient(125deg,#163d37,#16263b);margin-bottom:14px}.hero .value{font-size:36px}.value{font-size:25px;font-weight:750;letter-spacing:-.8px;overflow-wrap:anywhere;margin:9px 0}.eyebrow{font-size:13px;color:#9db3ca}.positive{color:#75e6b7}.negative{color:#ff9ca6}.section{margin-top:25px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}h2{font-size:19px;margin:0}h3{margin:0 0 13px;font-size:16px}.btn{background:#68e1b3;border:0;border-radius:11px;padding:11px 15px;color:#09231c;font-weight:750}.btn.secondary{background:#23344b;color:#dbe9f8}.btn.danger{background:#4c2732;color:#ffc7ce}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.line{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.bar{height:9px;border-radius:30px;background:#2b3b50;overflow:hidden;margin:9px 0 15px}.fill{height:100%;background:#68e1b3;border-radius:30px}.fill.over{background:#ff8e97}.listrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #29384d}.listrow:last-child{border:0}.rowright{display:flex;gap:9px;align-items:center}.tag{font-size:11px;background:#25364a;border-radius:7px;padding:5px 7px;color:#b8c9d9}.tinybtn{background:transparent;color:#afc2d7;border:1px solid #35465d;border-radius:8px;padding:5px 8px}.hidden{display:none!important}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#a8bdd2;font-size:13px;margin:0 0 5px}input,select{width:100%;border:1px solid #35465d;background:#0d1829;color:#f0f6ff;border-radius:10px;padding:12px;min-width:0}input:focus,select:focus{outline:2px solid #54bb99}.formactions{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}.empty{color:#93a8bf;padding:18px 0}.notice{font-size:12px;color:#a4b6ca;line-height:1.6}.footer{margin-top:35px;color:#8298b0;font-size:12px}.statnum{font-size:19px;font-weight:700}.headingline{display:flex;align-items:center;gap:8px}.dot{width:10px;height:10px;border-radius:50%;background:#67e0b2}.filterrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.filterrow input,.filterrow select{width:auto;max-width:100%}.badge{color:#70e4b8;font-size:12px}.compact{padding:12px 0}.error{color:#ff9ca6;font-size:13px;margin-top:8px}.wrap{overflow-wrap:anywhere}@media(max-width:740px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.app{padding:18px 13px 80px}.card{padding:16px}.hero .value{font-size:30px}.value{font-size:21px}.formgrid{grid-template-columns:1fr}.pill{display:none}.rowright{flex-wrap:wrap;justify-content:flex-end}.nav{margin-top:18px}}@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="top"><div><div class="brand">My<span>Money</span><span style="font-size:12px;color:#91a4bc;letter-spacing:0"> · V1</span></div><div class="muted small">Your money, organized.</div></div><span class="pill">CAD · Local-only</span></header><nav class="nav" id="nav"></nav><main id="content"></main><footer class="footer">MyMoney V1 · All values in CAD · Data is stored in this browser only. Back up regularly. Not connected to any financial institution.</footer></div><script>
'use strict';const KEY='mymoney_v1_data';const tabs=['Dashboard','Transactions','Budgets','Income','Savings','Investments','Debts','Settings'];const cats=['Groceries','Rent & Housing','Transportation','Dining','Shopping','Subscriptions','Health & Fitness','Education','Entertainment','Utilities','Other'];const defaultData=()=>({transactions:[],budgets:{Groceries:300,'Rent & Housing':0,Transportation:0,Dining:0,Shopping:0,Subscriptions:0,'Health & Fitness':0,Education:0,Entertainment:0,Utilities:0,Other:0},goals:[],holdings:[],debts:[]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||defaultData();if(!db.transactions||!db.budgets||!db.goals||!db.holdings||!db.debts)throw Error('Invalid data')}catch(e){db=defaultData()}let tab='Dashboard',editing=null,formOpen=false,month=new Date().toISOString().slice(0,7),error='';const money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){error='Storage failed. Please export your data.';return false}};const selected=()=>db.transactions.filter(x=>x.date.slice(0,7)===month);const sum=(a)=>a.reduce((s,x)=>s+Number(x.amount),0);const income=()=>sum(selected().filter(x=>x.type==='income'));const expenses=()=>sum(selected().filter(x=>x.type==='expense'));const totalGoals=()=>sum(db.goals.map(x=>({amount:x.balance})));const totalInvestments=()=>sum(db.holdings.map(x=>({amount:x.balance})));const totalDebt=()=>sum(db.debts.map(x=>({amount:x.balance})));const netFlow=()=>income()-expenses();const balance=()=>sum(db.transactions.filter(x=>x.type==='income'))-sum(db.transactions.filter(x=>x.type==='expense'))-totalGoals()-totalInvestments();const opts=(items,val)=>items.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join('');const btn=(text,act,cls='secondary')=>`<button class="btn ${cls}" data-act="${act}">${text}</button>`;const row=(name,desc,value,actions='')=>`<div class="listrow"><div class="wrap"><strong>${esc(name)}</strong><div class="muted small">${esc(desc)}</div></div><div class="rowright"><strong>${value}</strong>${actions}</div></div>`;const empty=(s)=>`<div class="empty">${s}</div>`;function render(){document.getElementById('nav').innerHTML=tabs.map(x=>`<button data-tab="${x}" class="${tab===x?'active':''}">${x}</button>`).join('');let html=tab==='Dashboard'?dashboard():tab==='Transactions'?transactions():tab==='Budgets'?budgets():tab==='Income'?incomePage():tab==='Savings'?assetsPage('goals'):tab==='Investments'?assetsPage('holdings'):tab==='Debts'?assetsPage('debts'):settings();document.getElementById('content').innerHTML=(error?`<p class="error">${esc(error)}</p>`:'')+html;document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{tab=el.dataset.tab;formOpen=false;editing=null;error='';render()});document.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>act(el.dataset.act,el.dataset.id));document.querySelectorAll('[data-month]').forEach(el=>el.onchange=e=>{month=e.target.value;render()});document.querySelectorAll('form').forEach(el=>el.onsubmit=e=>{e.preventDefault();submit(el)});}
function monthPicker(){return `<input aria-label="Select month" data-month type="month" value="${month}" style="width:175px">`}
function dashboard(){let t=selected().slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);let spentByCat=c=>sum(selected().filter(x=>x.type==='expense'&&x.category===c));return `<div class="card hero"><div class="eyebrow">Estimated unallocated cash flow (all recorded transactions)</div><div class="value">${money(balance())}</div><div class="notice">Income minus expenses and recorded savings/investment allocations. Not a verified bank balance. Initial account balances are not included.</div></div><div class="sectionhead"><h2>Monthly overview</h2>${monthPicker()}</div><div class="grid"><div class="card"><div class="eyebrow">Income</div><div class="value positive">${money(income())}</div></div><div class="card"><div class="eyebrow">Expenses</div><div class="value negative">${money(expenses())}</div></div><div class="card"><div class="eyebrow">Net cash flow</div><div class="value">${money(netFlow())}</div></div><div class="card"><div class="eyebrow">Debt outstanding</div><div class="value">${money(totalDebt())}</div></div></div><div class="section two"><div class="card"><h3>Monthly budgets</h3>${Object.entries(db.budgets).filter(([k,v])=>v>0).length?Object.entries(db.budgets).filter(([k,v])=>v>0).map(([k,v])=>{let spent=spentByCat(k);return `<div class="line"><span>${esc(k)}</span><span class="small">${money(spent)} / ${money(v)}</span></div><div class="bar"><div class="fill ${spent>v?'over':''}" style="width:${Math.min(100,spent/v*100)}%"></div></div>`}).join(''):empty('Set a budget to see progress.')}</div><div class="card"><h3>Recent transactions</h3>${t.length?t.map(x=>row(x.note||x.category,`${x.date} · ${x.category}`,`<span class="${x.type==='income'?'positive':'negative'}">${x.type==='income'?'+':'−'}${money(x.amount)}</span>`)).join(''):empty('No transactions this month yet.')}<div class="formactions">${btn('Add transaction','newTx','')}</div></div></div><div class="section grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="card"><div class="eyebrow">Savings allocated</div><div class="value">${money(totalGoals())}</div></div><div class="card"><div class="eyebrow">Investments recorded</div><div class="value">${money(totalInvestments())}</div></div></div>`}
function txForm(){let x=db.transactions.find(x=>x.id===editing)||{date:new Date().toLocaleDateString('en-CA'),type:'expense',category:'Groceries',amount:'',note:'',source:''};return `<div class="card section"><h3>${editing?'Edit':'New'} transaction</h3><form id="txform"><div class="formgrid"><div><label>Type</label><select name="type" id="txType"><option value="expense" ${x.type==='expense'?'selected':''}>Expense</option><option value="income" ${x.type==='income'?'selected':''}>Income</option></select></div><div><label>Amount (CAD)</label><input name="amount" type="number" min="0.01" step="0.01" value="${esc(x.amount)}" required></div><div><label>Date</label><input name="date" type="date" value="${esc(x.date)}" required></div><div><label>Expense category</label><select name="category">${opts(cats,x.category)}</select></div><div><label>Income source (for income)</label><input name="source" maxlength="80" placeholder="Job, side business, freelance..." value="${esc(x.source)}"></div><div><label>Note</label><input name="note" maxlength="100" placeholder="Optional description" value="${esc(x.note)}"></div></div><div class="formactions"><button class="btn">Save transaction</button>${btn('Cancel','cancel')}</div></form><p class="notice">Transfers between your own accounts are not expenses. Record savings and investments in their dedicated sections instead.</p></div>`}
function transactions(){let all=selected().slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="sectionhead"><h2>Transactions</h2>${monthPicker()}</div>${btn('＋ Add transaction','newTx','')}${formOpen?txForm():''}<div class="card section"><h3>${all.length} transactions</h3>${all.length?all.map(x=>row(x.note||x.source||x.category,`${x.date} · ${x.type==='income'?x.source||'Other income':x.category}`,`<span class="${x.type==='income'?'positive':'negative'}">${x.type==='income'?'+':'−'}${money(x.amount)}</span>`,`<button class="tinybtn" data-act="editTx" data-id="${x.id}">Edit</button><button class="tinybtn" data-act="delTx" data-id="${x.id}">Delete</button>`)).join(''):empty('No transactions yet. Add your first one.')}</div>`}
function budgets(){return `<div class="sectionhead"><h2>Monthly budgets</h2>${monthPicker()}</div><div class="card"><p class="notice">Budgets apply to every month until you change them. Set a limit to 0 to disable that category.</p><form id="budgetform"><div class="formgrid">${cats.map(c=>`<div><label>${esc(c)}</label><input type="number" min="0" step="0.01" name="${esc(c)}" value="${Number(db.budgets[c]||0)}"></div>`).join('')}</div><div class="formactions"><button class="btn">Save budgets</button></div></form></div>`}
function incomePage(){let entries=selected().filter(x=>x.type==='income');let groups={};entries.forEach(x=>{let k=x.source||'Other income';groups[k]=(groups[k]||0)+Number(x.amount)});return `<div class="sectionhead"><h2>Income sources</h2>${monthPicker()}</div><div class="card hero"><div class="eyebrow">Total income this month</div><div class="value">${money(income())}</div></div><div class="card section"><h3>Breakdown by source</h3>${Object.entries(groups).length?Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([k,v])=>row(k,`${income()?Math.round(v/income()*100):0}% of monthly income`,money(v))).join(''):empty('Add an income transaction with a source to see it here.')}</div>${btn('＋ Record income','newIncome','')}`}
function assetForm(type){let x=db[type].find(x=>x.id===editing)||{name:'',balance:'',target:'',rate:''};let label=type==='goals'?'Savings goal':type==='holdings'?'Investment':'Debt';return `<div class="card section"><h3>${editing?'Edit':'Add'} ${label.toLowerCase()}</h3><form id="assetform" data-type="${type}"><div class="formgrid"><div><label>Name</label><input name="name" required maxlength="80" placeholder="${type==='goals'?'Emergency fund':type==='holdings'?'TFSA / ETF':'Credit card'}" value="${esc(x.name)}"></div><div><label>${type==='debts'?'Outstanding balance':type==='holdings'?'Current value / contributed amount':'Current saved amount'} (CAD)</label><input name="balance" type="number" min="0" step="0.01" required value="${esc(x.balance)}"></div>${type==='goals'?`<div><label>Savings target (CAD)</label><input name="target" type="number" min="0.01" step="0.01" required value="${esc(x.target)}"></div>`:''}${type==='debts'?`<div><label>Annual interest rate (%)</label><input name="rate" type="number" min="0" max="100" step="0.01" value="${esc(x.rate)}"></div>`:''}</div><div class="formactions"><button class="btn">Save</button>${btn('Cancel','cancel')}</div></form></div>`}
function assetsPage(type){let title=type==='goals'?'Savings goals':type==='holdings'?'Investments':'Debts';let total=type==='goals'?totalGoals():type==='holdings'?totalInvestments():totalDebt();return `<div class="sectionhead"><h2>${title}</h2></div><div class="card hero"><div class="eyebrow">${type==='debts'?'Total outstanding':'Total recorded'}</div><div class="value">${money(total)}</div><div class="notice">${type==='holdings'?'Values are manually entered, not live market quotes.':'Balances are manually entered and are not linked to transactions.'}</div></div>${btn('＋ Add '+(type==='goals'?'goal':type==='holdings'?'investment':'debt'),'newAsset','')}${formOpen?assetForm(type):''}<div class="card section"><h3>${title}</h3>${db[type].length?db[type].map(x=>{let detail=type==='goals'?`${money(x.balance)} of ${money(x.target)} goal`:type==='debts'?`${x.rate||0}% annual interest (entered manually)`:'Manually tracked balance';let actions=`<button class="tinybtn" data-act="editAsset" data-id="${x.id}">Edit</button><button class="tinybtn" data-act="delAsset" data-id="${x.id}">Delete</button>`;return row(x.name,detail,money(x.balance),actions)+(type==='goals'?`<div class="bar"><div class="fill" style="width:${Math.min(100,Number(x.balance)/Number(x.target)*100||0)}%"></div></div>`:'')}).join(''):empty('Nothing tracked here yet.')}</div>`}
function settings(){return `<h2>Settings & backup</h2><div class="card section"><h3>Your data</h3><p class="notice">This V1 runs entirely in your browser. It does not have an account, server backup, or bank connection. Clearing browser data or using another device may make your records unavailable.</p><div class="formactions">${btn('Export backup (.json)','export','')}${btn('Import backup','import')}${btn('Erase all local data','erase','danger')}</div><input type="file" id="importFile" accept="application/json,.json" class="hidden"><p class="notice">Export regularly and store the backup somewhere safe. JSON backups contain sensitive financial information.</p></div><div class="card section"><h3>Future updates</h3><p class="notice">Cloud accounts, secure synchronization, CSV imports, recurring bills, transaction reconciliation, and optional bank connectivity are planned for later versions.</p></div>`}
function act(a,id){error='';if(a==='newTx'||a==='newIncome'){tab='Transactions';editing=null;formOpen=true;render();if(a==='newIncome'){document.querySelector('#txType').value='income'}return}if(a==='newAsset'){editing=null;formOpen=true;render();return}if(a==='cancel'){editing=null;formOpen=false;render();return}if(a==='editTx'||a==='editAsset'){editing=id;formOpen=true;render();return}if(a==='delTx'||a==='delAsset'){let type=a==='delTx'?'transactions':tab==='Savings'?'goals':tab==='Investments'?'holdings':'debts';if(confirm('Delete this record?')){db[type]=db[type].filter(x=>x.id!==id);save();render()}return}if(a==='export'){let blob=new Blob([JSON.stringify({version:1,data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='MyMoney-backup-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(a==='import'){let inp=document.getElementById('importFile');inp.onchange=async()=>{try{let parsed=JSON.parse(await inp.files[0].text());let d=parsed.data;if(parsed.version!==1||!d||!Array.isArray(d.transactions)||!Array.isArray(d.goals)||!Array.isArray(d.holdings)||!Array.isArray(d.debts)||!d.budgets||typeof d.budgets!=='object')throw Error('Invalid backup');if(!confirm('Replace all existing MyMoney data with this backup?'))return;db=d;save();render()}catch(e){alert('Could not import this backup. Check that it is a MyMoney V1 JSON file.')}};inp.click();return}if(a==='erase'){if(confirm('Permanently erase all local MyMoney data in this browser? Export a backup first.')){db=defaultData();save();render()}}}
function submit(form){let d=new FormData(form);error='';if(form.id==='txform'){let amount=Number(d.get('amount')),date=String(d.get('date'));if(!(amount>0&&Number.isFinite(amount))||!/^\d{4}-\d{2}-\d{2}$/.test(date)){error='Enter a valid date and positive amount.';render();return}let type=d.get('type');let x={id:editing||uid(),type,amount,date,category:type==='expense'?String(d.get('category')):'',source:type==='income'?String(d.get('source')).trim():'',note:String(d.get('note')).trim()};if(editing)db.transactions=db.transactions.map(z=>z.id===editing?x:z);else db.transactions.push(x)}else if(form.id==='budgetform'){for(let c of cats){let n=Number(d.get(c));if(!Number.isFinite(n)||n<0){error='Budget amounts must be zero or positive.';render();return}db.budgets[c]=n}}else if(form.id==='assetform'){let type=form.dataset.type,balance=Number(d.get('balance')),target=Number(d.get('target')),rate=Number(d.get('rate'));if(!Number.isFinite(balance)||balance<0||(type==='goals'&&!(target>0))||(type==='debts'&&(!Number.isFinite(rate)||rate<0||rate>100))){error='Check your amounts and try again.';render();return}let x={id:editing||uid(),name:String(d.get('name')).trim(),balance};if(!x.name){error='Enter a name.';render();return}if(type==='goals')x.target=target;if(type==='debts')x.rate=rate;if(editing)db[type]=db[type].map(z=>z.id===editing?x:z);else db[type].push(x)}editing=null;formOpen=false;save();render()}
render();</script></body></html>
